version: "2"
linters:
  enable:
    - gocritic
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    rules:
      # Sampling remains part of the MCP compatibility window and upstream parity surface.
      - path: ^ai/mcp/sampling(_messages|_model|_test)?\.go$
        text: "SA1019:"
        linters:
          - staticcheck
formatters:
  enable:
    - gofmt
