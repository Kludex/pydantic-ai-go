<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent chat</title>
  <style>
    body { font: 16px system-ui; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; }
    #messages { min-height: 20rem; }
    article { white-space: pre-wrap; padding: .75rem; margin: .5rem 0; border-radius: .5rem; background: #f3f4f6; }
    article.user { background: #dbeafe; }
    article.tool { font-family: monospace; font-size: .875rem; }
    form { display: flex; gap: .5rem; }
    input { flex: 1; padding: .75rem; }
    button { padding: .75rem 1rem; }
  </style>
</head>
<body>
  <h1>Agent chat</h1>
  <main id="messages" aria-live="polite"></main>
  <form id="chat"><input id="prompt" autocomplete="off" autofocus><button>Send</button></form>
  <script>
    const messages = [];
    const list = document.querySelector("#messages");
    const form = document.querySelector("#chat");
    const prompt = document.querySelector("#prompt");
    const id = crypto.randomUUID();

    function add(role, text, className = role) {
      const node = document.createElement("article");
      node.className = className;
      node.textContent = `${role}: ${text}`;
      list.append(node);
      return node;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = prompt.value.trim();
      if (!text) return;
      prompt.value = "";
      add("user", text);
      messages.push({id: crypto.randomUUID(), role: "user", parts: [{type: "text", text}]});
      const assistant = {id: crypto.randomUUID(), role: "assistant", parts: []};
      const textNode = add("assistant", "");
      const toolParts = new Map();
      const response = await fetch("/api/chat", {
        method: "POST", headers: {"content-type": "application/json"},
        body: JSON.stringify({trigger: "submit-message", id, messages}),
      });
      const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
      let buffered = "";
      while (true) {
        const {value, done} = await reader.read();
        if (done) break;
        buffered += value;
        const records = buffered.split("\n\n");
        buffered = records.pop();
        for (const record of records) {
          const data = record.split("\n").find((line) => line.startsWith("data: "))?.slice(6);
          if (!data || data === "[DONE]") continue;
          const chunk = JSON.parse(data);
          if (chunk.type === "text-delta") {
            textNode.textContent += chunk.delta;
          } else if (chunk.type === "tool-input-start") {
            const part = {type: `tool-${chunk.toolName}`, toolCallId: chunk.toolCallId, state: "input-streaming", input: {}};
            toolParts.set(chunk.toolCallId, part);
            assistant.parts.push(part);
            add("tool", `${chunk.toolName} started`, "tool");
          } else if (chunk.type === "tool-input-available") {
            const part = toolParts.get(chunk.toolCallId);
            if (part) { part.state = "input-available"; part.input = chunk.input; }
          } else if (chunk.type === "tool-output-available") {
            const part = toolParts.get(chunk.toolCallId);
            if (part) { part.state = "output-available"; part.output = chunk.output; }
            add("tool", `${chunk.toolCallId} completed`, "tool");
          } else if (chunk.type === "tool-output-error") {
            const part = toolParts.get(chunk.toolCallId);
            if (part) { part.state = "output-error"; part.errorText = chunk.errorText; }
            add("tool", `${chunk.toolCallId} failed: ${chunk.errorText}`, "tool");
          } else if (chunk.type === "error") {
            add("error", chunk.errorText);
          }
        }
      }
      const answer = textNode.textContent.replace(/^assistant: /, "");
      if (answer) assistant.parts.unshift({type: "text", text: answer});
      messages.push(assistant);
    });
  </script>
</body>
</html>
